<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Bureau d'exemple : lampe, carnet et tiroir entrouvert</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3a37"/><stop offset="1" stop-color="#2a2927"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5434"/><stop offset="1" stop-color="#5c3e26"/></linearGradient>
    <linearGradient id="woodD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e3f27"/><stop offset="1" stop-color="#46301e"/></linearGradient>
    <radialGradient id="light" cx=".3" cy=".35" r=".6"><stop offset="0" stop-color="#ffd99a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd99a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="470" width="800" height="130" fill="#23211f"/>
  <rect width="800" height="600" fill="url(#light)"/>
  <!-- cadre au mur -->
  <rect x="520" y="70" width="170" height="120" fill="#262523" stroke="#5a4a36" stroke-width="8"/>
  <path d="M532 178l45-55 30 35 22-20 49 40z" fill="#3b4250"/>
  <!-- plateau -->
  <rect x="90" y="300" width="620" height="26" rx="3" fill="url(#wood)"/>
  <!-- caisson -->
  <rect x="470" y="326" width="220" height="214" fill="url(#woodD)"/>
  <rect x="482" y="340" width="196" height="80" rx="3" fill="#6a4a2f" stroke="#3c2a1a" stroke-width="2"/>
  <rect x="566" y="374" width="28" height="7" rx="3" fill="#c9a46a"/>
  <!-- tiroir du bas entrouvert -->
  <rect x="482" y="436" width="196" height="88" rx="3" fill="#2a1d12"/>
  <rect x="472" y="448" width="216" height="84" rx="3" fill="#74512f" stroke="#3c2a1a" stroke-width="2"/>
  <path d="M472 448l10-12h196l10 12z" fill="#8a6440"/>
  <rect x="566" y="484" width="28" height="7" rx="3" fill="#c9a46a"/>
  <path d="M500 448c20-6 40 2 60-4" stroke="#e8e2d4" stroke-width="5" fill="none" opacity=".8"/>
  <!-- pied gauche -->
  <rect x="110" y="326" width="18" height="214" fill="url(#woodD)"/>
  <!-- lampe -->
  <ellipse cx="200" cy="298" rx="48" ry="8" fill="#1d1d1d"/>
  <path d="M196 296l8-120 4 0-6 120z" fill="#2d2d2d"/>
  <path d="M168 176l60-52 18 22-60 52z" fill="#262626"/>
  <path d="M150 196c10-30 50-60 92-56l-20 66c-26 0-54-4-72-10z" fill="#313131"/>
  <ellipse cx="190" cy="214" rx="38" ry="10" fill="#ffe4ad" opacity=".9" transform="rotate(-14 190 214)"/>
  <!-- carnet -->
  <g transform="rotate(-6 340 290)">
    <rect x="290" y="270" width="120" height="28" rx="3" fill="#1f2c3a"/>
    <rect x="296" y="266" width="110" height="26" rx="2" fill="#efe8d8"/>
    <rect x="290" y="262" width="120" height="8" rx="2" fill="#2c3e52"/>
  </g>
  <rect x="420" y="284" width="70" height="5" rx="2" fill="#c9a46a" transform="rotate(8 455 286)"/>
  <!-- tasse -->
  <rect x="600" y="262" width="34" height="38" rx="5" fill="#d7d2c6"/>
  <path d="M634 270c14 0 14 22 0 22" stroke="#d7d2c6" stroke-width="5" fill="none"/>
</svg>
